spring:
  application:
    name: mcp-bsl-context
  cache:
    type: simple
  ai:
    mcp:
      server:
        # Информация о сервере
        name: "1C Platform API Server"
        version: "1.0.0"
        description: "MCP сервер для поиска по API платформы 1С Предприятие"
        instructions: "MCP сервер для поиска по API платформы 1С Предприятие. Выполняет поиск по свойствам, методам и типам."
        type: SYNC

        # Возможности сервера
        capabilities:
          tools:
            # Поддержка инструментов
            enabled: true
          resources:
            # Поддержка ресурсов (отключено для простоты)
            enabled: false
          prompts:
            # Поддержка промптов (отключено для простоты)
            enabled: false
  # Отключаем баннер Spring Boot для чистого STDIO вывода
  main:
    banner-mode: off

# Настройки платформы 1С
platform:
  context:
    # Путь к каталогу с файлами платформы (содержащий shcntx_root.hbk)
    # Можно переопределить через переменную окружения PLATFORM_CONTEXT_PATH
    path: ${PLATFORM_CONTEXT_PATH:}

# Настройки документации
# Внешние пути к файлам документации (можно менять без пересборки JAR)
# Если не указаны - используются встроенные ресурсы из JAR
docs:
  guideline:
    # Путь к файлу guideline.md
    # Пример: /path/to/guideline.md или C:\docs\guideline.md
    path: ${DOCS_GUIDELINE_PATH:}
  strict-types:
    # Путь к файлу strict-types.md
    # Пример: /path/to/strict-types.md или C:\docs\strict-types.md
    path: ${DOCS_STRICT_TYPES_PATH:}
  checks:
    # Путь к каталогу с описаниями проверок (*.md файлы с кодом проверки в имени)
    # Пример: /path/to/checks или C:\docs\checks
    # Каждый файл должен называться по коду проверки: begin-transaction.md, query-in-loop-check.md
    path: ${DOCS_CHECKS_PATH:}

# Настройки логирования
logging:
  config: classpath:logback-mcp.xml
  # Все остальные настройки логгирования теперь берутся из logback-mcp.xml
  level:
    root: INFO

# Настройки кэширования
cache:
  api-search:
    expire-after-write: 1h
  api-info:
    expire-after-write: 1h
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=5m